name: Release

on:
  push:
    tags:
      # 注意：tag 过滤是 glob 不是正则。`[0-9]+` 里的 `+` 在 glob 中是字面量，
      # 早先用正则写法导致任何真实 tag 都匹配不上，工作流从未被触发。
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    # 发布守卫：仅允许实际发布仓库打 tag 时构建并上传 Release。
    # 上游仓库若存在同名 tag（fork 关系）不会触发发版，避免把包推到错误仓库。
    if: github.repository == 'xyz50270/newBV'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release preconditions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::缺少发版摘要 $NOTES，请先提交该文件再打 tag"
            exit 1
          fi

          PREV="$(git tag --sort=-v:refname | grep -vxF "$TAG" | head -n 1 || true)"
          if [ -n "$PREV" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$PREV" "$TAG" | sort -V | tail -n 1)"
            if [ "$HIGHEST" != "$TAG" ]; then
              echo "::error::tag $TAG 不大于已有最新 tag $PREV"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing config
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          echo "$SIGNING_PROPERTIES" | base64 -d > signing.properties
          echo "$SIGN_KEY" | base64 -d > key.jks

      - name: Configure app crash token
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: |
          if [ -z "$CRASH_REPORT_TOKEN" ]; then
            echo "::warning::未配置 CRASH_REPORT_TOKEN，崩溃上传将不可用"
          else
            echo "crashReport.token=$CRASH_REPORT_TOKEN" >> local.properties
          fi

      - name: Build release APK
        env:
          NEWBV_VERSION_BASE: ${{ github.ref_name }}
        run: |
          export NEWBV_VERSION_BASE="${NEWBV_VERSION_BASE#v}"
          ./gradlew assembleRelease

      - name: Parse version
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          echo "versionCode=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_ENV"
          echo "versionName=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_ENV"

      # WORKER_ADMIN_TOKEN 为 Worker 管理端 ADMIN_TOKEN；APK 内使用的是 CRASH_REPORT_TOKEN
      # 未配置时跳过：fork 场景通常没有管理端凭据，不应因此阻断发版
      - name: Upload mapping to crash backend
        env:
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          if [ -z "$WORKER_ADMIN_TOKEN" ]; then
            echo "::warning::未配置 WORKER_ADMIN_TOKEN，跳过 mapping 上传（崩溃堆栈将无法还原）"
            exit 0
          fi
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          SIZE=$(stat -c%s "$MAPPING")
          gzip -9 -c "$MAPPING" > mapping.txt.gz
          curl -sfS -X POST \
            "https://crash-log.frost819.site/api/mapping/upload?versionCode=${versionCode}&gzip=1&size=${SIZE}" \
            -H "Authorization: Bearer ${WORKER_ADMIN_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @mapping.txt.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newBV_${{ env.versionName }}
          path: app/build/outputs/apk/release/newBV_${{ env.versionCode }}_${{ env.versionName }}_release.apk

      - name: Generate release body
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/generate_release_body.py release_body.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/newBV_${{ env.versionCode }}_${{ env.versionName }}_release.apk
          tag_name: ${{ github.ref_name }}
          name: newBV ${{ env.versionName }}
          body_path: release_body.md
          draft: false
          prerelease: false
